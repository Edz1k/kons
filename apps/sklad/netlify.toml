# Склад warehouse.brillex.kz — приложение apps/sklad монорепо.
# В Netlify (по документации для монорепо): Base directory — пусто (корень репозитория),
# Package directory — apps/sklad. Установка и сборка идут из корня, где pnpm-lock.yaml и pnpm-workspace.yaml;
# все пути ниже — от корня репозитория.
[build]
command = "pnpm build:sklad"
publish = "apps/sklad/dist"
# Пересобираем, только если изменилось само приложение, общий пакет или зависимости.
# Первая сборка и ручной «Trigger deploy» приходят с одинаковыми ссылками — тогда собираем всегда.
ignore = "[ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/sklad packages/shared package.json pnpm-lock.yaml pnpm-workspace.yaml"

[build.environment]
NODE_VERSION = "20"
VITE_DIRECTUS_URL = "https://cms.brillex.kz"

# одностраничное приложение: любой адрес → index.html (файлы из dist отдаются как есть)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"

[headers.values]
# склад закрыт от поисковиков целиком (плюс robots.txt и <meta name="robots">)
X-Robots-Tag = "noindex, nofollow"
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "same-origin"
# камера нужна сканеру, остальное выключено
Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
Strict-Transport-Security = "max-age=31536000"
# скрипты и стили только свои; запросы — только в Directus
Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://cms.brillex.kz; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# service worker и манифест не кэшируем: иначе телефоны не увидят новую версию
[[headers]]
for = "/sw.js"

[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/manifest.webmanifest"

[headers.values]
Cache-Control = "no-cache"
Content-Type = "application/manifest+json"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
